<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字幕叠放生成器</title>
<style>
  :root{color-scheme:light dark}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Microsoft YaHei,Arial;display:flex;flex-direction:column;gap:16px;margin:0;padding:24px;background:#111;color:#eee}
  .panel{display:grid;grid-template-columns:1fr;gap:12px;max-width:960px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  input[type="file"]{padding:8px;background:#222;border:1px solid #333;border-radius:8px}
  textarea{width:100%;min-height:160px;resize:vertical;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#eee;padding:12px;line-height:1.6}
  button{padding:10px 16px;border-radius:8px;border:1px solid #333;background:#3b82f6;color:#fff;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .controls{display:flex;gap:12px;flex-wrap:wrap}
  .preview{display:flex;flex-direction:column;gap:12px}
  canvas{max-width:100%;height:auto;background:#000;border-radius:8px}
  .note{font-size:12px;opacity:.8}
  .range{display:flex;align-items:center;gap:8px}
  .range input{width:240px}
  .range input[type="number"]{width:120px;padding:6px;background:#222;border:1px solid #333;border-radius:8px;color:#eee}
  .range input[type="color"]{height:32px;width:48px;padding:0;border:1px solid #333;border-radius:6px;background:#222}
  a.download{color:#3b82f6;text-decoration:none}
</style>
</head>
<body>
  <div class="panel">
    <div class="row">
      <input id="file" type="file" accept="image/*">
      <div class="range">
        <label for="imgW">图片宽度(px)</label>
        <input id="imgW" type="number" min="120" max="4096" step="1" value="900">
      </div>
      <div class="range">
        <label for="bandPx">字幕高度(px)</label>
        <input id="bandPx" type="number" min="24" max="600" step="1" value="100">
      </div>
      <div class="range">
        <label for="margin">底部边距比例(%)</label>
        <input id="margin" type="range" min="0" max="20" value="4">
        <span id="marginLabel">4%</span>
      </div>
      <div class="range">
        <label for="fontSize">字体大小(px)</label>
        <input id="fontSize" type="number" min="12" max="200" step="1" value="40">
      </div>
      <div class="range">
        <label for="fontColor">字体颜色</label>
        <input id="fontColor" type="color" value="#ffffff">
      </div>
      <div class="range">
        <label for="strokeColor">轮廓颜色</label>
        <input id="strokeColor" type="color" value="#000000">
      </div>
    </div>
    <textarea id="text" placeholder="每行一个字幕"></textarea>
    <div class="controls">
      <button id="gen" disabled>生成</button>
      <a id="dl" class="download" href="#" download="stacked-subtitles.png" style="display:none">下载图片</a>
    </div>
    <div class="note">上传图片后输入多行文字，点击生成。会在原图底部字幕位显示首行，同时把每行的字幕区域叠放在原图下方，所有字幕均可见。</div>
    <div class="preview">
      <canvas id="cv"></canvas>
    </div>
  </div>
<script>
const fileInput = document.getElementById('file');
const genBtn = document.getElementById('gen');
const textArea = document.getElementById('text');
const canvas = document.getElementById('cv');
const dl = document.getElementById('dl');
const imgWInput = document.getElementById('imgW');
const bandPxInput = document.getElementById('bandPx');
const marginRange = document.getElementById('margin');
const marginLabel = document.getElementById('marginLabel');
const fontSizeInput = document.getElementById('fontSize');
const fontColorInput = document.getElementById('fontColor');
const strokeColorInput = document.getElementById('strokeColor');

let img = null;

marginRange.addEventListener('input',()=>marginLabel.textContent = marginRange.value + '%');

fileInput.addEventListener('change', async () => {
  const f = fileInput.files && fileInput.files[0];
  if (!f) { img = null; genBtn.disabled = true; return; }
  const url = URL.createObjectURL(f);
  const i = new Image();
  i.onload = () => { img = i; genBtn.disabled = false; URL.revokeObjectURL(url); };
  i.src = url;
});

function parseLines(s){
  return s.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
}

function drawText(ctx, w, yTop, hBand, line, fontSize, fontColor, strokeColor){
  const size = fontSize || Math.round(hBand * 0.42);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${size}px "Microsoft YaHei", "PingFang SC", system-ui, Arial`;
  ctx.shadowColor = 'rgba(0,0,0,.75)';
  ctx.shadowBlur = Math.round(size*0.12);
  ctx.strokeStyle = strokeColor || 'rgba(0,0,0,.9)';
  ctx.lineWidth = Math.max(2, Math.round(size*0.08));
  ctx.fillStyle = fontColor || '#fff';
  const yCenter = yTop + hBand/2;
  ctx.strokeText(line, w/2, yCenter);
  ctx.fillText(line, w/2, yCenter);
  ctx.restore();
}

function drawBand(ctx, yTop, w, hBand){
  const gradient = ctx.createLinearGradient(0, yTop, 0, yTop + hBand);
  gradient.addColorStop(0, 'rgba(0,0,0,.35)');
  gradient.addColorStop(0.5, 'rgba(0,0,0,.25)');
  gradient.addColorStop(1, 'rgba(0,0,0,.35)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, yTop, w, hBand);
}

genBtn.addEventListener('click', () => {
  if (!img) return;
  const lines = parseLines(textArea.value);
  if (!lines.length) return;
  const targetW = Math.max(120, Math.min(4096, Number(imgWInput.value) || 900));
  const scale = targetW / img.naturalWidth;
  const targetH = Math.round(img.naturalHeight * scale);
  const hBand = Math.max(24, Math.min(600, Math.round(Number(bandPxInput.value) || 100)));
  const marginPercent = Number(marginRange.value)/100;
  const bottomMargin = Math.round(targetH * marginPercent);
  const subtitleTop = Math.max(0, targetH - hBand - bottomMargin);
  const appended = Math.max(0, lines.length - 1);
  const totalHeight = targetH + appended * (bottomMargin + hBand);
  canvas.width = targetW;
  canvas.height = totalHeight;
  canvas.style.width = targetW + 'px';
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  // 1) 绘制缩放后的原图
  ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, targetW, targetH);
  // 2) 绘制带与文字（原图底部）
  drawBand(ctx, subtitleTop, targetW, hBand);
  const fontSize = Math.round(Number(fontSizeInput.value) || hBand * 0.42);
  const fontColor = fontColorInput.value || '#ffffff';
  const strokeColor = strokeColorInput.value || '#000000';
  drawText(ctx, targetW, subtitleTop, hBand, lines[0], fontSize, fontColor, strokeColor);
  // 3) 复制“原图底部间距 + 字幕带”到每一层，确保各层间距一致
  for (let i = 1; i < lines.length; i++){
    const yGapTop = targetH + (i-1) * (bottomMargin + hBand);
    const yBandTop = yGapTop + bottomMargin;
    if (bottomMargin > 0) {
      ctx.drawImage(canvas, 0, subtitleTop + hBand, targetW, bottomMargin, 0, yGapTop, targetW, bottomMargin);
    }
    ctx.drawImage(canvas, 0, subtitleTop, targetW, hBand, 0, yBandTop, targetW, hBand);
    drawBand(ctx, yBandTop, targetW, hBand);
    drawText(ctx, targetW, yBandTop, hBand, lines[i], fontSize, fontColor, strokeColor);
  }
  dl.href = canvas.toDataURL('image/png');
  dl.style.display = 'inline-block';
});
</script>
</body>
</html>
